name: Backend Tests

"on":
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "backend/scripts/**"
      - "client/scripts/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "backend/scripts/**"
      - "client/scripts/**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      # Тестам не нужен реальный Postgres — conftest.py подменяет get_db
      # на SQLite. Но app/database.py при импорте требует DATABASE_URL,
      # иначе create_engine(None) упадёт ещё до старта тестов.
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v