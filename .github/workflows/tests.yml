name: Backend Tests

"on":
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "backend/scripts/**"
      - "client/scripts/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "backend/scripts/**"
      - "client/scripts/**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # Настоящий Postgres, а не имитация — критично именно потому, что
    # часть поведения проекта расходится между SQLite и Postgres (отказ
    # на NUL-байтах, лимиты длины строк, типы дат). Доказано экспериментом:
    # тест на NUL-байты проходил даже при полностью сломанном валидаторе,
    # пока CI гонял только SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DATABASE_URL нужен для самого факта импорта app/database.py (там
      # create_engine(DATABASE_URL) выполняется на уровне модуля — без
      # значения упало бы ещё до старта тестов). TEST_DATABASE_URL — то,
      # что реально использует conftest.py для тестовой базы. В CI оба
      # указывают на один и тот же service-контейнер Postgres.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v